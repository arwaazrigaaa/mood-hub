<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mood Hub</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <header>
      <h1>Mood Hub</h1>
      <p class="subtitle">How are you feeling today?</p>
    </header>

    <!-- 1. Pick a mood -->
    <section class="card">
      <div id="mood-picker" class="mood-picker">
        <!-- Buttons are generated by script.js -->
      </div>
      <textarea id="note" placeholder="Add a note (optional)..." maxlength="200"></textarea>
      <button id="save-btn" class="save-btn" disabled>Save mood</button>
    </section>

    <!-- 2. Stats -->
    <section class="card stats">
      <div class="stat">
        <span id="stat-total" class="stat-value">0</span>
        <span class="stat-label">entries</span>
      </div>
      <div class="stat">
        <span id="stat-streak" class="stat-value">0</span>
        <span class="stat-label">day streak</span>
      </div>
      <div class="stat">
        <span id="stat-average" class="stat-value">–</span>
        <span class="stat-label">7-day mood</span>
      </div>
    </section>

    <!-- 3. History -->
    <section class="card">
      <h2>History</h2>
      <ul id="history" class="history"></ul>
      <p id="empty-message" class="empty">No moods yet. Log your first one above!</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
